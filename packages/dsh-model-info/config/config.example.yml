- id: model-info
  config:
    providers:
      my-relay:
        catalogProvider: openrouter
        contextWindowPolicy: min
        models:
          gpt-special:
            alias: openai/gpt-5.6-sol
          '*/claude-opus-5-5':
            alias: anthropic/claude-opus-5-5
          house-model:
            skip: true
          fast-model:
            override:
              reasoningEfforts:
                off:
                high: high
    rules:
      - id: thinking
        kind: suffix
        value: -thinking
        override:
          contextWindow: 250000
